<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact</title>

  <style>
    *{ box-sizing: border-box; }

    body{
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(
        135deg,
        #f3c6a8 0%,
        #efe2d8 38%,
        #e6e9f5 55%,
        #b7c6ee 78%,
        #8fa6e8 100%
      );
      min-height: 100vh;
      color: #000;
    }

    .page{
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    .back{
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      color: #000;
      display: inline-block;
      margin-bottom: 28px;
    }
    .back:hover{ text-decoration: underline; }

    h1{
      text-align: center;
      font-size: 42px;
      margin: 0 0 28px;
    }

    .card{
      background: rgba(255,255,255,0.65);
      border: 1px solid rgba(0,0,0,0.12);
      border-radius: 18px;
      padding: 26px;
      box-shadow: 0 18px 44px rgba(0,0,0,0.16);
      backdrop-filter: blur(10px);
    }

    label{
      display: block;
      font-weight: 700;
      margin: 16px 0 6px;
    }

    input, textarea{
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,0.25);
      background: rgba(255,255,255,0.9);
      font-family: inherit;
      outline: none;
    }

    input:focus, textarea:focus{
      border-color: rgba(0,0,0,0.55);
    }

    textarea{
      min-height: 160px;
      resize: vertical;
    }

    button{
      margin-top: 18px;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 12px;
      border: none;
      background: rgba(0,0,0,0.85);
      color: #fff;
      cursor: pointer;
      width: 180px;
    }

    button:hover{ opacity: 0.92; }

    .status{
      margin-top: 12px;
      font-size: 14px;
      min-height: 18px;
      opacity: 0.85;
    }

    /* Honeypot: hidden from humans, visible to bots that fill everything */
    .hp-wrap{
      position: absolute !important;
      left: -10000px !important;
      top: auto !important;
      width: 1px !important;
      height: 1px !important;
      overflow: hidden !important;
    }

    @media (max-width: 600px){
      h1{ font-size: 34px; }
      button{ width: 100%; }
    }
  </style>
</head>

<body>
  <main class="page">
    <a class="back" href="about.html">← Back</a>

    <h1>Contact</h1>

    <section class="card">
      <form id="contactForm" novalidate>
        <label for="name">Name</label>
        <input id="name" name="name" autocomplete="name" required />

        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />

        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>

        <!-- Honeypot field (must be named "website" to match Apps Script) -->
        <div class="hp-wrap" aria-hidden="true">
          <label for="website">Website</label>
          <input id="website" name="website" tabindex="-1" autocomplete="off" />
        </div>

        <button type="submit" id="sendBtn">Send</button>

        <div class="status" id="status" role="status" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxwfZJKVLAJIPCGxQ2BZQFNdRKzE9Y7eg_qqG5JonXDJx4RE_CalvIA6B9T-XFtpWrTQg/exec";
    const form = document.getElementById("contactForm");
    const statusEl = document.getElementById("status");
    const sendBtn = document.getElementById("sendBtn");

    // Time-to-submit protection: record when the user first loaded the form
    const startedAt = Date.now();

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function setBusy(isBusy) {
      sendBtn.disabled = isBusy;
      sendBtn.style.opacity = isBusy ? "0.7" : "1";
      sendBtn.style.cursor = isBusy ? "not-allowed" : "pointer";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = form.elements.name.value.trim();
      const email = form.elements.email.value.trim();
      const message = form.elements.message.value.trim();
      const website = form.elements.website.value.trim(); // honeypot

      // Basic front-end validation (server still validates)
      if (!name) return setStatus("Please enter your name.");
      if (!email || !email.includes("@")) return setStatus("Please enter a valid email.");
      if (!message) return setStatus("Please enter a message.");

      setBusy(true);
      setStatus("Sending…");

      const payload = {
        name,
        email,
        message,
        website,     // honeypot (bots fill this)
        startedAt    // time-to-submit check (Apps Script verifies)
      };

      try {
        // NOTE: no-cors means we can't read JSON response, but the request will go through.
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        setStatus("Message sent. Thank you for writing.");
        form.reset();
      } catch (err) {
        setStatus("Something went wrong. Please try again.");
      } finally {
        setBusy(false);
      }
    });
  </script>
</body>
</html>

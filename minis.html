<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minis</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: #000;

      /* Peach → cream → strong blue */
      background: linear-gradient(
        135deg,
        #f3c6a8 0%,
        #efe2d8 38%,
        #e6e9f5 55%,
        #b7c6ee 78%,
        #8fa6e8 100%
      );

      min-height: 100vh;
    }

    .page {
      max-width: 900px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    .back {
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      color: #000;
      display: inline-block;
      margin-bottom: 32px;
    }

    .back:hover {
      text-decoration: underline;
    }

    h1 {
      text-align: center;
      font-size: 44px;
      margin: 0 0 48px;
    }

    .minis {
      display: flex;
      flex-direction: column;
      gap: 22px;
      padding-left: 80px;
    }

    .minis a {
      font-size: 30px;
      font-weight: 700;
      text-decoration: none;
      color: #000;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .minis a:hover {
      transform: translateX(4px);
      opacity: 0.85;
    }

    .song {
      font-size: 18px;
      font-weight: 600;
      margin-top: 32px;
      padding-left: 80px;
    }

    .song a {
      color: #000;
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 36px;
      }

      .minis {
        padding-left: 24px;
      }

      .minis a {
        font-size: 26px;
      }

      .song {
        padding-left: 24px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <a class="back" href="index.html">← Back to Home</a>

    <h1>Minis</h1>

    <nav class="minis">
      <a href="mini-1.html">Rest</a>
      <a href="mini-2.html">Mathew 6:27</a>
    </nav>

    <div class="song">
      🎵
      <a
        href="https://www.youtube.com/watch?v=Optrm7lF16s&list=RDOptrm7lF16s&start_radio=1"
        target="_blank"
        rel="noopener noreferrer"
      >
        Be Thou My Vision (Song)
      </a>
    </div>
  </main>
</body>
</html>
